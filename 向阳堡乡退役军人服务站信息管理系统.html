<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>向阳堡乡退役军人服务站信息管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --pri:#1652a8; --pri-d:#0f3d80; --pri-l:#e9f1fd; --pri-l2:#f4f8fe;
  --bg:#eef1f6; --card:#ffffff; --bd:#e2e7ef; --bd2:#eef1f6;
  --tx:#1e2430; --tx2:#5b6472; --tx3:#939ba8;
  --red:#d92d20; --red-l:#fdecea; --amber:#c98a00; --amber-l:#fdf5e3;
  --blue:#2a7de1; --blue-l:#eaf2fd; --green:#0f9d58; --green-l:#e8f7ef;
  --r:10px; --sh:0 1px 3px rgba(20,35,70,.06),0 6px 18px rgba(20,35,70,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--tx); font-size:14px; line-height:1.6;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--pri);text-decoration:none}
.hide{display:none !important}

.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.muted{color:var(--tx2)}.muted3{color:var(--tx3)}
.tiny{font-size:12px}
.center{text-align:center}

/* ---------- 通用按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--bd);
  background:#fff;color:var(--tx);font-size:13px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#c9d3e2;background:#fafbfd}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d);border-color:var(--pri-d)}
.btn.danger{background:#fff;border-color:#f0bdb7;color:var(--red)}
.btn.danger:hover{background:var(--red-l)}
.btn.warn{background:#fff;border-color:#f0d79a;color:var(--amber)}
.btn.warn:hover{background:var(--amber-l)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{background:#f1f4f9}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- 表单控件 ---------- */
label.fl{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
label.fl .req{color:var(--red);margin-left:2px}
.inp,select.inp,textarea.inp{
  width:100%;height:36px;padding:0 11px;border:1px solid var(--bd);border-radius:8px;
  background:#fff;outline:none;transition:.15s}
textarea.inp{height:auto;padding:8px 11px;resize:vertical;line-height:1.6}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(22,82,168,.10)}
.inp:disabled,.inp[readonly]{background:#f5f7fa;color:var(--tx2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- 顶部栏 ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--bd)}
.topbar .in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.emblem{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#1b3a5f,#0f2138);box-shadow:inset 0 0 0 1px rgba(201,162,39,.55)}
.emblem svg{width:21px;height:21px;display:block}
.brand b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:var(--tx3);display:block;line-height:1.2}
.who{font-size:12px;color:var(--tx2);text-align:right;line-height:1.35;flex:none}
.who b{color:var(--tx);font-weight:600}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;line-height:16px}
.tag.town{background:#e9f1fd;color:var(--pri)}
.tag.vil{background:#e8f7ef;color:var(--green)}
.topbar .in.nav{padding-top:0;padding-bottom:9px;gap:5px;overflow-x:auto}
.nv{height:30px;padding:0 13px;border-radius:7px;font-size:13px;color:var(--tx2);white-space:nowrap;flex:none;transition:.14s}
.nv:hover{background:#f1f4f9;color:var(--tx)}
.nv.on{background:var(--pri-l);color:var(--pri);font-weight:600}
.nv .cnt{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:8px;
  background:var(--red);color:#fff;font-size:10px;text-align:center;margin-left:5px;vertical-align:1px;font-weight:400}

/* ---------- 看板 / 图表 ---------- */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.panels{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
.panel h3{margin:0 0 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel h3:before{content:"";width:3px;height:14px;border-radius:2px;background:var(--pri)}
.panel h3 .more{margin-left:auto;font-size:12px;font-weight:400;color:var(--tx3)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:104px 1fr 72px;gap:10px;align-items:center;font-size:12.5px}
.bar .bl{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:14px;background:#f1f4f9;border-radius:7px;overflow:hidden}
.bar .bt i{display:block;height:100%;border-radius:7px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
.bar .bv u{text-decoration:none;color:var(--tx3);font-size:11px;margin-left:3px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;flex:1;min-width:150px}
.legend .lg{display:flex;align-items:center;gap:8px}
.legend .lg i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lg .n{flex:1;color:var(--tx2)}
.legend .lg .v{font-variant-numeric:tabular-nums}

/* ---------- 预警记录 ---------- */
.wlist{display:flex;flex-direction:column;gap:10px}
.witem{border:1px solid var(--bd);border-radius:var(--r);background:#fff;padding:13px 15px;box-shadow:var(--sh)}
.witem.un{border-left:3px solid var(--red)}
.witem.hd{border-left:3px solid var(--green)}
.witem .wh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.witem .wh b{font-size:13.5px}
.witem .wt{font-size:11.5px;color:var(--tx3);font-family:ui-monospace,Consolas,monospace;margin-left:auto}
.witem .wc{background:#f4f8fe;border:1px solid #cfe0f8;border-radius:8px;padding:9px 12px;
  font-size:12.5px;color:#123f86;line-height:1.8;word-break:break-all}
.witem .wf{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.witem .wnote{font-size:12px;color:var(--tx2);background:#f7f9fc;border-radius:7px;padding:6px 10px;flex:1;min-width:160px}

/* ---------- 数据管理 ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.dcard{border:1px solid var(--bd);border-radius:var(--r);padding:16px;background:#fff;box-shadow:var(--sh);
  display:flex;flex-direction:column}
.dcard h4{margin:0 0 6px;font-size:13.5px;font-weight:600}
.dcard p{margin:0 0 14px;font-size:12.5px;color:var(--tx2);line-height:1.75;flex:1}

/* ---------- 登录页 · 荣誉墙 ---------- */
.lg2{position:relative;min-height:100vh;display:grid;grid-template-columns:1.12fr .88fr;
  background:
    radial-gradient(1200px 680px at 14% -12%,#1e3a5f 0%,transparent 60%),
    radial-gradient(900px 600px at 92% 112%,#17324f 0%,transparent 58%),
    linear-gradient(158deg,#0a1421 0%,#0e1d31 46%,#09121d 100%)}
.lg2:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:
    repeating-linear-gradient(45deg,rgba(255,255,255,.030) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.020) 0 1px,transparent 1px 5px)}
.lg2:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(125% 95% at 50% 44%,transparent 38%,rgba(0,0,0,.62) 100%)}
.lg2>*{position:relative;z-index:2}

.honor{display:flex;align-items:center;padding:56px 64px;overflow:hidden;position:relative}
.honor:before,.honor:after{content:"";position:absolute;width:48px;height:48px;
  border:1px solid rgba(201,162,39,.45);pointer-events:none}
.honor:before{left:32px;top:32px;border-right:none;border-bottom:none}
.honor:after{right:32px;bottom:32px;border-left:none;border-top:none}
.honor-inner{max-width:520px;position:relative;z-index:2}
.starwm{position:absolute;left:-104px;bottom:-128px;width:540px;height:540px;opacity:.07;pointer-events:none}
.starwm path{fill:none;stroke:#e8d7a4;stroke-width:1.1}
.starwm circle{fill:none;stroke:#e8d7a4;stroke-width:.7}
.honor-emblem{width:64px;height:64px;margin-bottom:26px;position:relative}
.honor-emblem svg{width:100%;height:100%;display:block;position:relative;z-index:1}
.honor-emblem:after{content:"";position:absolute;inset:-18px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(201,162,39,.20),transparent 68%)}
.honor-title{font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",serif;
  font-size:36px;line-height:1.44;font-weight:700;letter-spacing:.07em;color:#f4ecd8;margin:0;
  text-shadow:0 2px 20px rgba(0,0,0,.55)}
.honor-rule{display:flex;align-items:center;gap:10px;margin:20px 0 14px}
.honor-rule span{height:1px;flex:1;background:linear-gradient(90deg,rgba(201,162,39,.78),rgba(201,162,39,.10))}
.honor-rule span:last-child{background:linear-gradient(90deg,rgba(201,162,39,.10),rgba(201,162,39,.78))}
.honor-rule i{color:#c9a227;font-size:9px;font-style:normal}
.honor-sub{font-family:"KaiTi","STKaiti","Kaiti SC",serif;font-size:15px;color:#b9c6d8;margin:0 0 28px;letter-spacing:.18em}
.honor-list{list-style:none;margin:0;padding:0}
.honor-list li{position:relative;padding:11px 0 11px 24px;font-size:13.5px;color:#c6d1e0;
  letter-spacing:.02em;border-bottom:1px dashed rgba(201,162,39,.17)}
.honor-list li:last-child{border-bottom:none}
.honor-list li:before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;
  background:#c9a227;transform:rotate(45deg);box-shadow:0 0 8px rgba(201,162,39,.6)}
.honor-list b{color:#f0d98a;font-weight:600}
.honor-foot{margin-top:32px;display:flex;align-items:center;gap:12px}
.honor-foot .rb{width:3px;height:30px;background:linear-gradient(180deg,#c9a227,#7d6415);border-radius:2px}
.honor-foot p{margin:0;font-family:"KaiTi","STKaiti",serif;font-size:15px;letter-spacing:.34em;color:#d9c489}

.lg2-form{display:flex;align-items:center;justify-content:center;padding:40px 48px}
.card-in{width:100%;max-width:400px;position:relative;border-radius:4px;padding:30px 28px 24px;
  background:linear-gradient(180deg,#fbf7ee,#f3ecdc);
  border:1px solid rgba(201,162,39,.42);
  box-shadow:0 34px 80px -22px rgba(0,0,0,.74),inset 0 0 0 1px rgba(255,255,255,.5)}
.card-in:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:4px 4px 0 0;
  background:linear-gradient(90deg,#0f2138,#1b3a5f 22%,#c9a227 50%,#1b3a5f 78%,#0f2138)}
.card-in:after{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(0deg,rgba(120,100,60,.030) 0 1px,transparent 1px 3px)}
.card-head{display:flex;gap:12px;align-items:center;margin-bottom:22px;position:relative}
.seal{width:36px;height:36px;flex:none}
.seal svg{width:100%;height:100%;display:block}
.card-head h2{margin:0;font-family:"Songti SC","STSong","SimSun",serif;font-size:20px;font-weight:700;
  letter-spacing:.16em;color:#20283a}
.card-head p{margin:3px 0 0;font-size:11.5px;color:#8b8265;letter-spacing:.04em}
.lgf{margin-bottom:15px;position:relative}
.lgf label{display:block;font-family:"KaiTi","STKaiti",serif;font-size:12.5px;color:#8a7c58;
  letter-spacing:.16em;margin-bottom:1px}
.lgf label .req{color:#b03a2e}
.lg-inp{width:100%;height:36px;background:transparent;border:none;border-bottom:1.5px solid #d5c9ac;
  padding:0 2px;font-size:14.5px;color:#232a38;outline:none;border-radius:0;
  transition:border-color .2s,box-shadow .2s}
.lg-inp::placeholder{color:#b3a98f}
.lg-inp:focus{border-bottom-color:#b08a1e;box-shadow:0 8px 14px -12px rgba(176,138,30,.9)}
.btn-login{width:100%;height:46px;margin-top:6px;border-radius:5px;border:1px solid #c9a227;
  background:linear-gradient(180deg,#1d3557,#12233c);color:#f2e3b8;font-size:15px;font-weight:500;
  letter-spacing:.5em;text-indent:.5em;cursor:pointer;
  box-shadow:0 14px 28px -14px rgba(10,25,50,.95),inset 0 1px 0 rgba(255,255,255,.10);transition:.18s}
.btn-login:hover{background:linear-gradient(180deg,#24406a,#162b4a);letter-spacing:.6em}
.btn-login:active{transform:translateY(1px)}
.lg-hint{margin:13px 0 0;text-align:center;font-size:11.5px;color:#8b8265;letter-spacing:.03em}
.lg-hint b{color:#8a6a12}
.roster{margin-top:18px;border-top:1px solid rgba(140,120,70,.22);padding-top:12px}
.roster .rt{font-size:11.5px;color:#8b8265;letter-spacing:.1em;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.roster .rt:after{content:"";flex:1;height:1px;background:rgba(140,120,70,.22)}
.roster-note{font-size:11.5px;line-height:1.7;color:#7a7259;margin-bottom:8px;padding:7px 10px;
  background:rgba(201,162,39,.10);border-left:2px solid rgba(176,58,46,.55);border-radius:0 3px 3px 0}
.roster-note b{color:#b03a2e}
.roster-list{max-height:160px;overflow:auto;border:1px solid rgba(140,120,70,.20);border-radius:4px;
  background:rgba(255,255,255,.45)}
.rw{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;font-size:12px;cursor:pointer;
  border-bottom:1px solid rgba(140,120,70,.14);transition:.14s}
.rw:last-child{border-bottom:none}
.rw:hover{background:rgba(201,162,39,.14)}
.rw .nm{width:58px;font-weight:600;color:#2a3140}
.rw .ph{width:104px;font-family:ui-monospace,Consolas,monospace;color:#4c5464}
.rw .vg{flex:1;color:#8b8265;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .lv{font-size:10.5px;padding:0 6px;border-radius:2px;line-height:16px;border:1px solid;flex:none}
.rw .lv.town{color:#8a6a12;border-color:rgba(176,138,30,.6);background:rgba(201,162,39,.16)}
.rw .lv.vil{color:#3f5f42;border-color:rgba(90,130,95,.5);background:rgba(120,160,120,.16)}

@keyframes lgRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.honor-inner>*{animation:lgRise .75s cubic-bezier(.2,.7,.3,1) both}
.honor-inner>*:nth-child(1){animation-delay:.04s}
.honor-inner>*:nth-child(2){animation-delay:.12s}
.honor-inner>*:nth-child(3){animation-delay:.20s}
.honor-inner>*:nth-child(4){animation-delay:.28s}
.honor-inner>*:nth-child(5){animation-delay:.36s}
.honor-inner>*:nth-child(6){animation-delay:.44s}
.card-in{animation:lgRise .85s .22s cubic-bezier(.2,.7,.3,1) both}
@media(prefers-reduced-motion:reduce){.honor-inner>*,.card-in{animation:none}}
@media(max-width:960px){
  .lg2{grid-template-columns:1fr}
  .honor{padding:38px 28px 6px;align-items:flex-start}
  .honor:before{left:14px;top:14px;width:34px;height:34px}
  .honor:after{display:none}
  .honor-title{font-size:25px}
  .honor-list li{font-size:13px;padding-top:8px;padding-bottom:8px}
  .honor-foot{margin-top:18px}
  .starwm{display:none}
  .lg2-form{padding:20px 18px 42px}
  .card-in{max-width:520px}
  .roster-list{max-height:192px}
}

/* ---------- 统计卡 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat .k{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:600;line-height:1.35;letter-spacing:.3px}
.stat .u{font-size:12px;color:var(--tx3);margin-left:3px;font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-blue{background:var(--pri)}.d-red{background:var(--red)}.d-amber{background:var(--amber)}
.d-green{background:var(--green)}.d-gray{background:#9aa4b2}

/* ---------- 地图 ---------- */
.map-wrap{position:relative;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);
  padding:8px;max-width:1100px;margin:0 auto}
.map-svg{width:100%;height:auto;display:block;touch-action:manipulation}
.vcell{cursor:pointer}
.vcell:hover .vdot{filter:brightness(.9)}
.vcell.dis{cursor:not-allowed}
.vcell.dis .vdot{filter:saturate(.35)}
.vnum{font-size:12.5px;font-weight:700;pointer-events:none;user-select:none;
  font-family:"DIN Alternate","Bahnschrift",system-ui,sans-serif}
.vbadge{font-size:10px;font-weight:700;pointer-events:none;user-select:none;
  font-family:"DIN Alternate","Bahnschrift",system-ui,sans-serif}
.vlabel{font-size:12.5px;font-weight:600;pointer-events:none;user-select:none;
  paint-order:stroke;stroke:#fbf4e4;stroke-width:3px;stroke-linejoin:round}
/* 底图地名（自然村）：浅灰斜体小字，权重低于行政村村名 */
.nlabel{font-size:10px;font-style:italic;font-weight:400;fill:#aab2bf;letter-spacing:.3px;
  pointer-events:none;user-select:none;
  paint-order:stroke;stroke:#fbf4e4;stroke-width:2.8px;stroke-linejoin:round}
.govlabel{font-size:10.5px;font-weight:700;fill:#b03a2e;pointer-events:none;user-select:none;
  paint-order:stroke;stroke:#fbf4e4;stroke-width:3px;stroke-linejoin:round}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:8px 10px;font-size:12px;color:var(--tx2)}
.map-legend i{display:inline-block;width:22px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;border:1px solid rgba(0,0,0,.06)}
.hover-tip{position:absolute;pointer-events:none;background:rgba(25,32,45,.94);color:#fff;font-size:12px;
  padding:7px 10px;border-radius:7px;line-height:1.65;white-space:nowrap;z-index:20;opacity:0;transition:opacity .12s}
.hover-tip.on{opacity:1}

/* ---------- 表格 ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:1180px}
table.tbl th,table.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd2);white-space:nowrap}
table.tbl thead th{background:#f7f9fc;color:var(--tx2);font-weight:600;font-size:12px;position:sticky;top:0;z-index:2}
table.tbl tbody tr:hover{background:#fafcff}
table.tbl tbody tr:last-child td{border-bottom:none}
.risk-th .rl{display:inline-block;padding:0 5px;border-radius:4px;font-size:10px;line-height:15px;margin-left:3px;color:#fff;font-weight:400}

var DB=null;
function defaultDB(){
  return {
    persons:genPersons(),
    warnings:[],
    visits:[],              /* 来访诉求 */
    baoyi:[],               /* 七包一 */
    passwords:{},           /* 手机号 -> 密码（改密后写入） */
    pageNotes:{},           /* 页面备注 */
    seeded:true
  };
}
/* 结构就地升级：为早期版本写入的记录补齐新增字段。
   本次新增字段均为「可缺省」的增量字段，不需要换存储键、不会丢数据。 */
function normalizeDB(){
  if(!DB.warnings)DB.warnings=[];
  if(!DB.passwords)DB.passwords={};
  if(!DB.pageNotes)DB.pageNotes={};
  if(!DB.visits)DB.visits=[];
  if(!DB.baoyi)DB.baoyi=[];
  (DB.persons||[]).forEach(function(p){
    if(typeof p.photo!=='string')p.photo='';
    if(!p.aids)p.aids=[];
    if(!p.family)p.family=[];
    if(!p.contacts)p.contacts=[];
    p.family.forEach(function(f){if(typeof f.address!=='string')f.address=''});
    p.contacts.forEach(function(c){if(!c.photos)c.photos=[]});
    p.aids.forEach(function(a){if(!a.photos)a.photos=[]});
  });
  (DB.visits||[]).forEach(function(v){
    if(!v.id)v.id='V'+uid();
    if(!v.handle||VISIT_STATUS.indexOf(v.handle)<0)v.handle=VISIT_STATUS[1];
    if(v.status!==0)v.status=1;
    if(typeof v.delReason!=='string')v.delReason='';
    if(typeof v.delAt!=='string')v.delAt='';
  });
  (DB.baoyi||[]).forEach(function(b){
    if(!b.id)b.id='B'+uid();
    if(b.status!==0)b.status=1;
    if(typeof b.delReason!=='string')b.delReason='';
    if(typeof b.delAt!=='string')b.delAt='';
  });
}
function loadDB(){
  try{
    for(var li=0;li<LEGACY_KEYS.length;li++){ try{ localStorage.removeItem(LEGACY_KEYS[li]) }catch(e2){} }
    var raw=localStorage.getItem(STORE_KEY);
    if(raw){
      DB=JSON.parse(raw);
      /* 仅当结构本身不可用（不是对象 / 没有 persons 数组）才重建，
         空库（0 条档案）是合法状态，不能被当成损坏数据清掉。 */
      if(!DB||typeof DB!=='object'||!DB.persons)DB=defaultDB();
    }else DB=defaultDB();
  }catch(e){ DB=defaultDB(); }
  normalizeDB();
}

function saveDB(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); return true }
  catch(e){ toast('本地存储空间不足，本次修改未持久化（照片过多时容易出现）','err'); return false }
}
function resetDB(){
  DB=defaultDB(); saveDB();
}

/* ---------------- 统计 ---------------- */
function personsOf(v){
  return DB.persons.filter(function(p){return p.village===v&&p.status===1});
}
function statOf(v){
  /* V3 需求 1：全乡退役军人数 = 系统人数 = 建档立卡人数，
     故 veteran 直接取档案总数，不再按人员类别区分。 */
  var ps=personsOf(v),o={total:ps.length,veteran:ps.length,key:0,lc:0,party:0,secretary:0,r0:0,r1:0,r2:0,r3:0};
  ps.forEach(function(p){
    var c=catOf(p.category);
    if(c.key)o.key++;
    if(c.lc)o.lc++;
    if(p.political==='中共党员'||p.political==='中共预备党员')o.party++;
    if(p.isSecretary==='是')o.secretary++;
    if(p.riskLevel===1)o.r1++;else if(p.riskLevel===2)o.r2++;else if(p.riskLevel===3)o.r3++;else o.r0++;
  });
  return o;
}
/* 风险等级：0 / 空 = 未评定（需求 8 允许不填） */
function riskBadge(lv){
  if(lv===1)return '<span class="badge b1">1级 高</span>';
  if(lv===2)return '<span class="badge b2">2级 中</span>';
  if(lv===3)return '<span class="badge b3">3级 低</span>';
  return '<span class="badge b0">未评定</span>';
}
function riskName(lv){
  if(lv===1)return '1 级 · 高风险';
  if(lv===2)return '2 级 · 中风险';
  if(lv===3)return '3 级 · 低风险';
  return '未评定';
}
/* 排序权重：1 级最前，未评定最后 */
function riskRank(lv){return (lv===1||lv===2||lv===3)?lv:9}
/* 按风险等级排序（需求 3）：同级按建档时间先后，保证顺序稳定 */
function sortByRisk(list){
  return list.slice().sort(function(a,b){
    var d=riskRank(a.riskLevel)-riskRank(b.riskLevel);
    if(d)return d;
    var ca=a.createdAt||'',cb=b.createdAt||'';
    if(ca!==cb)return ca<cb?-1:1;
    return 0;
  });
}
/* 来访诉求：办理情况的标签样式 */
function visitCls(s){return s==='已办结'?'st1':(s==='处理中'?'st2':'st3')}
function townStat(){
  var o={total:0,veteran:0,key:0,lc:0,r1:0,covered:0};
  VILLAGES.forEach(function(v){
    var s=statOf(v);
    o.total+=s.total;o.veteran+=s.veteran;o.key+=s.key;o.lc+=s.lc;o.r1+=s.r1;
    if(s.total>0)o.covered++;
  });
  return o;
}

  if(S.user.lv==='town')return VILLAGES.slice();
  return [S.user.v];

/* ---------------- 地图 ---------------- */
/* 色阶：由浅到深，表示退役军人数量多少 */
function mixColor(t){
  var a=[223,235,250], b=[26,86,168];
  var r=Math.round(a[0]+(b[0]-a[0])*t), g=Math.round(a[1]+(b[1]-a[1])*t), bl=Math.round(a[2]+(b[2]-a[2])*t);
  return 'rgb('+r+','+g+','+bl+')';
}
/* 村名标注方位：u上 d下 l左 r右（取自参考地图上村名相对标记点的位置） */
function mapLabel(x,y,dir){
  if(dir==='u')return [x,y-23,'middle'];
  if(dir==='d')return [x,y+31,'middle'];
  if(dir==='l')return [x-19,y+4.4,'end'];
  return [x+19,y+4.4,'start'];
}

function renderMap(){
  var maxC=1;
  VILLAGES.forEach(function(v){var s=statOf(v);if(s.total>maxC)maxC=s.total});
  var allowed=visibleVillages();
  var W=MAP_VB[0],H=MAP_VB[1];

  /* 底图：主干道（白色描边 + 金色路面） */
  var roads=MAP_ROADS.map(function(d){
    return '<path d="'+d+'" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>'
      +'<path d="'+d+'" fill="none" stroke="#e3ab2f" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>';
  }).join('');

  /* 底图地名：自然村（仅作地理参照，无数据、不可点击）
     按制图惯例降为底图要素——不画标记点，只留浅灰斜体小字，
     与「行政村」的主题要素（深色加粗村名 + 数据气泡）拉开层级 */
  var nature=MAP_NATURE.map(function(n){
    var left=(n[3]==='l');
    return '<text class="nlabel" x="'+(left?n[1]-2:n[1]+2)+'" y="'+(n[2]+3.6)+'" text-anchor="'+(left?'end':'start')+'">'+esc(n[0])+'</text>';
  }).join('');

  /* 21 个行政村 */
  var blobs='',labels='';
  MAP_VILLAGES.forEach(function(v){
    var name=v[0],x=v[1],y=v[2],dir=v[3];
    var s=statOf(name);
    var on=allowed.indexOf(name)>=0;
    var t=maxC>0?Math.min(1,s.total/maxC):0;
    var rad=on?Math.round(10+t*9):10;
    var fill=on?mixColor(0.16+t*0.7):'#e9edf3';
    var txt=on?(t>0.52?'#ffffff':'#123a6b'):'#aab3bf';
    var lp=mapLabel(x,y,dir);
    blobs+='<g class="vcell'+(on?'':' dis')+'" data-v="'+esc(name)+'">'
      +'<circle cx="'+x+'" cy="'+y+'" r="'+(rad+14)+'" fill="transparent"/>'
      +'<circle class="vdot" cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="'+fill+'" stroke="#ffffff" stroke-width="2.2"/>'
      +(on?'<text class="vnum" x="'+x+'" y="'+(y+4.6)+'" text-anchor="middle" fill="'+txt+'">'+s.total+'</text>':'')
      +(on&&s.r1>0?'<circle cx="'+(x+rad*0.74).toFixed(1)+'" cy="'+(y-rad*0.74).toFixed(1)+'" r="7.6"'
        +' fill="#d92d20" stroke="#ffffff" stroke-width="1.8"/>'
        +'<text class="vbadge" x="'+(x+rad*0.74).toFixed(1)+'" y="'+(y-rad*0.74+3.5).toFixed(1)+'"'
        +' text-anchor="middle" fill="#ffffff">'+s.r1+'</text>':'')
      +'</g>';
    labels+='<text class="vlabel" x="'+lp[0]+'" y="'+lp[1]+'" text-anchor="'+lp[2]+'"'
      +' fill="'+(on?'#1e2430':'#9aa3b0')+'">'+esc(name)+'</text>';
  });

  /* 乡政府驻地 */
  var gov='<g class="govmark">'
    +'<rect x="'+(MAP_GOV[0]-5.5)+'" y="'+(MAP_GOV[1]-5.5)+'" width="11" height="11" rx="2.5"'
    +' fill="#b03a2e" stroke="#ffffff" stroke-width="2"/>'
    +'<text class="govlabel" x="'+MAP_GOV[0]+'" y="'+(MAP_GOV[1]-13)+'" text-anchor="middle">向阳堡乡人民政府</text>'
    +'</g>';

  var legend='';
  for(var i=0;i<=4;i++)legend+='<i style="background:'+mixColor(0.16+(i/4)*0.7)+'"></i>';

  return '<div class="map-wrap">'
    +'<div class="map-legend">'
    +'<span>退役军人数量：</span><span style="display:flex;align-items:center">少 '+legend+' 多</span>'
    +'<span><span class="dot d-red" style="display:inline-block;vertical-align:middle;margin-right:4px"></span>角标为 1 级风险人数</span>'
    +'<span class="muted3">斜体小字为自然村（仅地理参照，无数据）</span>'
    +'<span class="muted3">轮廓依据《平鲁区向阳堡乡地图》绘制，为示意性分布，非精确测绘边界</span>'
    +'</div>'
    +'<svg class="map-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="向阳堡乡21个行政村分布示意图">'
    /* 画布压暗（需求 2）：乡域之外压成深色底，乡域本身留浅色，形成"图"与"底"的明暗对比 */
    +'<defs>'
      +'<linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1">'
        +'<stop offset="0" stop-color="#1e2c42"/><stop offset=".55" stop-color="#16202f"/><stop offset="1" stop-color="#0f1826"/>'
      +'</linearGradient>'
      +'<filter id="townsh" x="-8%" y="-8%" width="116%" height="116%">'
        +'<feDropShadow dx="0" dy="2.5" stdDeviation="6" flood-color="#000000" flood-opacity=".5"/>'
      +'</filter>'
    +'</defs>'
    +'<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="url(#mapbg)" rx="10"/>'
    +'<path d="'+TOWN_BORDER+'" fill="#fbf4e4" stroke="#c9a227" stroke-width="6.6" stroke-linejoin="round"'
      +' stroke-opacity=".55" filter="url(#townsh)"/>'
    +'<path d="'+TOWN_BORDER+'" fill="none" stroke="#1652a8" stroke-width="3.2" stroke-linejoin="round"/>'
    +roads+nature+gov+blobs+labels
    +'</svg>'
    +'<div class="hover-tip" id="mtip"></div>'
    +'</div>';
}

/* ---------------- 本机登录记录（只存账号，不存密码） ---------------- */
function accountOf(phone){
  for(var i=0;i<ACCOUNTS.length;i++)if(ACCOUNTS[i].p===phone)return ACCOUNTS[i];
  return null;
}
function loadLoginHistory(){
  try{
    var raw=localStorage.getItem(LOGIN_KEY);
    var a=raw?JSON.parse(raw):[];
    if(!(a instanceof Array))return [];
    var out=[];
    for(var i=0;i<a.length;i++){
      var p=String(a[i]);
      /* 账号已不在数据权限表里的，自动剔除 */
      if(accountOf(p)&&out.indexOf(p)<0)out.push(p);
    }
    return out.slice(0,LOGIN_MAX);
  }catch(e){return []}
}
function saveLoginHistory(a){
  try{ localStorage.setItem(LOGIN_KEY,JSON.stringify(a.slice(0,LOGIN_MAX))) }catch(e){}
}
/* 登录成功后调用：把账号挪到最前（只记账号，不含密码） */
function rememberLogin(phone){
  var a=loadLoginHistory().filter(function(p){return p!==phone});
  a.unshift(phone);
  saveLoginHistory(a);
}
function forgetLogin(phone){

/* ---- 账号输入框的下拉：点一下输入框就弹出登录过的账号，选一个直接填 ---- */
var AC_IDX=-1;
function acList(filter){
  var hist=loadLoginHistory(),out=[];
  for(var i=0;i<hist.length;i++){
    var a=accountOf(hist[i]);
    if(!a)continue;
    /* 已经敲了几位数字就按手机号前缀筛，敲的是名字就按姓名筛 */
    if(filter&&a.p.indexOf(filter)!==0&&a.n.indexOf(filter)<0)continue;
    out.push(a);
  }
  return out;
}
function renderAc(){
  var box=$('lg-ac');
  if(!box)return;
  var items=acList($('lg-phone').value.trim());
  var body;
  if(items.length){
    body=items.map(function(a){
      return '<div class="ai" data-pick="'+esc(a.p)+'">'
        +'<span class="p">'+esc(a.p)+'</span>'
        +'<span class="n">'+esc(a.n)+' · '+esc(a.v===TOWN_NAME?'向阳堡乡（全乡）':a.v)+'</span>'
        +'<span class="lv '+(a.lv==='town'?'town':'vil')+'">'+(a.lv==='town'?'乡级':'村级')+'</span>'
        +'<button class="rm" data-forget="'+esc(a.p)+'" title="从本机记录中移除">✕</button>'
        +'</div>';
    }).join('');
  }else{
    body='<div class="ac-empty">'+(loadLoginHistory().length
      ?'没有匹配的账号，可直接输入手机号'
      :'本机暂无登录记录 —— 登录一次后会自动记住账号')+'</div>';
  }
  box.innerHTML=body
    +'<div class="ac-foot"><span class="ac-tip">只记账号，不存密码</span>'
    +'<button class="lnk" id="lg-clear">清除记录</button></div>';
  AC_IDX=-1;
  bindAcItems();
}
function showAc(){var b=$('lg-ac');if(!b)return;renderAc();b.classList.remove('hide')}
function hideAc(){var b=$('lg-ac');if(b)b.classList.add('hide');AC_IDX=-1}
function paintAc(){
  var rows=document.querySelectorAll('#lg-ac .ai');
  for(var i=0;i<rows.length;i++){
    if(i===AC_IDX)rows[i].classList.add('on');else rows[i].classList.remove('on');
  }
}
function bindAcItems(){
  Array.prototype.forEach.call(document.querySelectorAll('#lg-ac .ai'),function(el){
    el.onmousedown=function(ev){if(ev&&ev.preventDefault)ev.preventDefault()};
    el.onclick=function(ev){
      var t=ev&&ev.target;
      if(t&&t.closest&&t.closest('[data-forget]'))return;   /* 点 ✕ 时不带出 */
      pickAccount(el.getAttribute('data-pick'));
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#lg-ac [data-forget]'),function(b){
    b.onmousedown=function(ev){if(ev&&ev.preventDefault)ev.preventDefault()};
    b.onclick=function(ev){
      if(ev&&ev.stopPropagation)ev.stopPropagation();
      forgetLogin(b.getAttribute('data-forget'));
      renderAc();
    };
  });
  var clr=$('lg-clear');
  if(clr){
    clr.onmousedown=function(ev){if(ev&&ev.preventDefault)ev.preventDefault()};
    clr.onclick=function(ev){
      if(ev&&ev.stopPropagation)ev.stopPropagation();
      saveLoginHistory([]);hideAc();
      toast('已清除本机登录记录');
    };
  }
}

function bindLogin(){
  $('lg-btn').onclick=doLogin;
  $('lg-pwd').onkeydown=function(e){if(e.key==='Enter')doLogin()};
  /* 账号框：聚焦或输入即弹出「登录过的账号」下拉 */
  var ph=$('lg-phone');
  ph.onfocus=function(){showAc()};
  ph.oninput=function(){showAc()};
  ph.onkeydown=function(e){
    var rows=document.querySelectorAll('#lg-ac .ai');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      var box=$('lg-ac');
      if(box&&box.classList.contains('hide'))showAc();
      rows=document.querySelectorAll('#lg-ac .ai');
      if(!rows.length)return;
      if(e.preventDefault)e.preventDefault();
      AC_IDX=(e.key==='ArrowDown')?Math.min(AC_IDX+1,rows.length-1):Math.max(AC_IDX-1,0);
      paintAc();return;
    }
    if(e.key==='Enter'){
      if(AC_IDX>=0&&rows[AC_IDX]){pickAccount(rows[AC_IDX].getAttribute('data-pick'));return}
      $('lg-pwd').focus();return;
    }
    if(e.key==='Escape'){hideAc();return}
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-fill]'),function(el){
    el.onclick=function(){
      $('lg-phone').value=el.getAttribute('data-fill');
      $('lg-pwd').value='Aa123456';
      hideAc();
      $('lg-pwd').focus();
    };
  });
  /* 一进登录页就自动弹出（本机有登录记录才弹） */
  if(loadLoginHistory().length)showAc();
}
function doLogin(){
  var ph=$('lg-phone').value.trim(), pw=$('lg-pwd').value, note=$('lg-note').value.trim();
  if(!/^\d{11}$/.test(ph)){toast('请输入 11 位手机号','err');return}
  var acc=null;
  for(var i=0;i<ACCOUNTS.length;i++)if(ACCOUNTS[i].p===ph)acc=ACCOUNTS[i];
  if(!acc){toast('该手机号不在数据权限表中','err');return}
  var real=DB.passwords[ph]||'Aa123456';
  if(pw!==real){toast('密码错误','err');return}
  S.user={phone:ph,name:acc.n,v:acc.v,lv:acc.lv};
  S.page=1;S.filters=null;S.showDeleted=false;
  rememberLogin(ph);            /* 只记住账号，不记密码 */
  if(note)DB.pageNotes['login-'+ph+'='+nowStr()]=note;
  S.view='map';                 /* 需求：登录后进入全乡行政村分布图 */
  if(acc.lv==='vil')S.village=acc.v;
  render();
  toast('登录成功，欢迎 '+acc.n,'ok');
}

function bindMap(){
  bindTopbar();

  Array.prototype.forEach.call(document.querySelectorAll('.vcell'),function(g){
    var v=g.getAttribute('data-v');
    g.onclick=function(){
      if(!canAccess(v)){toast('当前为村级权限，仅可查看本村数据','err');return}
      S.village=v;S.view='village';S.page=1;S.filters=null;render();
      window.scrollTo(0,0);
    };
    g.onmouseenter=function(e){
      if(!canAccess(v)){tip.innerHTML=esc(v)+'<br>无访问权限';}
      else{
        var s=statOf(v);
        tip.innerHTML=esc(v)+'<br>退役军人 '+s.veteran+' · 重点优抚 '+s.key
          +'<br>两参 '+s.lc+' · 兵支书 '+s.secretary
          +'<br>风险 1级 '+s.r1+' / 2级 '+s.r2+' / 3级 '+s.r3+(s.r0?' / 未评定 '+s.r0:'');
      }
      tip.classList.add('on');
    };
    g.onmousemove=function(e){
      var r=tip.parentNode.getBoundingClientRect();
      var x=e.clientX-r.left+14,y=e.clientY-r.top+12;
      if(x+tip.offsetWidth>r.width-6)x=e.clientX-r.left-tip.offsetWidth-14;
      tip.style.left=x+'px';tip.style.top=y+'px';
    };
    g.onmouseleave=function(){tip.classList.remove('on')};
  });

function blankFilters(){return {kw:'',category:'',risk:'',secretary:'',political:'',flag:''}}
function filterPersons(villages,f){
  return DB.persons.filter(function(p){
    if(villages.indexOf(p.village)<0)return false;
    if(S.showDeleted){ if(p.status!==0)return false; } else { if(p.status!==1)return false; }
    if(f.kw){
      var kw=f.kw;
      if(!((p.name||'').indexOf(kw)>=0||(p.phone||'').indexOf(kw)>=0
        ||(p.idCard||'').indexOf(kw)>=0||(p.address||'').indexOf(kw)>=0))return false;
    }
    if(f.category&&p.category!==f.category)return false;
    /* 风险筛选：''=全部，'0'=未评定，'1'/'2'/'3'=对应等级 */
    if(f.risk!==''&&f.risk!=null&&String(p.riskLevel||0)!==String(f.risk))return false;
    if(f.secretary&&p.isSecretary!==f.secretary)return false;
    if(f.political&&p.political!==f.political)return false;
    /* 快捷标签（看板统计卡跳转时带入） */
    if(f.flag==='veteran'&&!catOf(p.category).veteran)return false;
    if(f.flag==='key'&&!catOf(p.category).key)return false;
    if(f.flag==='lc'&&!catOf(p.category).lc)return false;
    if(f.flag==='risk1'&&p.riskLevel!==1)return false;
    return true;
  });
}

/* 人员表格：需求 3 —— 按风险等级排序（1 级在前、未评定最后），
   1 级仅把「风险防控等级」这一格标红，不做整行标红。 */
function personTableHtml(list,page,showVillage,emptyMsg){
  var pageSize=20,total=list.length,pages=Math.max(1,Math.ceil(total/pageSize));
  if(page>pages)page=pages;
  if(page<1)page=1;
  var start=(page-1)*pageSize;
  var rows=sortByRisk(list).slice(start,start+pageSize);
  var trs=rows.map(function(p,i){
    return '<tr>'
      +'<td>'+(start+i+1)+'</td>'
      +(showVillage?'<td>'+esc(p.village)+'</td>':'')
      +'<td><b>'+esc(p.name)+'</b></td>'
      +'<td>'+esc(p.gender)+'</td>'
      +'<td>'+esc(p.category)+'</td>'
      +'<td>'+esc(p.political)+'</td>'
      +'<td class="pw">'+esc(p.phone)+'</td>'
      +'<td>'+esc(p.enlistDate||'—')+'</td>'
      +'<td>'+esc(p.dischargeDate||'—')+'</td>'
      +'<td>'+(p.isSecretary==='是'?'<span class="badge bg">是</span>':'否')+'</td>'
      +'<td'+(p.riskLevel===1?' class="risk-hit"':'')+'>'+riskBadge(p.riskLevel)+'</td>'
      +'<td class="muted3">'+esc(p.remark||'—')+'</td>'
      +'<td><div class="ops">'
        +(p.status===0
          ? '<button class="btn sm" data-restore="'+p.id+'">恢复</button>'
          : '<button class="btn sm" data-view="'+p.id+'">查看</button>'
            +'<button class="btn sm" data-edit="'+p.id+'">编辑</button>'
            +'<button class="btn sm warn" data-warn="'+p.id+'">预警</button>'
            +'<button class="btn sm danger" data-del="'+p.id+'">删除</button>')
      +'</div></td>'
    +'</tr>';
  }).join('');
  var cols=showVillage?13:12;
  return {total:total,pages:pages,page:page,
    html:'<div class="tbl-wrap mt12">'
    +'<table class="tbl"><thead><tr>'
      +'<th style="width:44px">序号</th>'
      +(showVillage?'<th>行政村</th>':'')
      +'<th>姓名</th><th>性别</th><th>人员类别</th><th>政治面貌</th>'
      +'<th>联系方式</th><th>入伍时间</th><th>退伍时间</th><th>兵支书</th>'
      +'<th class="risk-th">风险防控等级 <span class="rl rl1">1级</span><span class="rl rl2">2级</span><span class="rl rl3">3级</span></th>'
      +'<th>备注</th><th style="width:210px">操作</th>'
    +'</tr></thead><tbody>'+(trs||'<tr><td colspan="'+cols+'"><div class="empty">'+emptyMsg+'</div></td></tr>')+'</tbody></table>'
    +'</div>'
    +'<div class="pager">'
      +'<span>共 '+total+' 条，第 '+page+'/'+pages+' 页</span>'
      +'<button class="pg" data-pg="1">首页</button>'
      +'<button class="pg" data-pg="'+(page-1)+'">上一页</button>'
      +'<button class="pg" data-pg="'+(page+1)+'">下一页</button>'
      +'<button class="pg" data-pg="'+pages+'">末页</button>'
    +'</div>'};
}

/* 人员列表页公共交互：筛选栏、分页、行内操作（村级台账 / 全乡列表共用）
   slot = 'filters' | 'filtersAll'，让两个页面各自记住自己的筛选条件 */
function bindListCommon(backFn,slot){
  bindTopbar(backFn);
  var fok=$('f-ok');
  if(fok)fok.onclick=function(){
    var f=S[slot]||blankFilters();
    f.kw=$('f-kw').value.trim();f.category=$('f-cat').value;f.risk=$('f-risk').value;
    f.secretary=$('f-sec').value;f.political=$('f-pol').value;
    S[slot]=f;S.page=1;render();
  };
  var fr=$('f-reset');
  if(fr)fr.onclick=function(){
    var f=blankFilters();
    f.flag=(S[slot]&&S[slot].flag)||'';   /* 重置保留快捷标签，标签本身在页面上可见 */
    S[slot]=f;S.page=1;render();
  };
  var fkw=$('f-kw');
  if(fkw)fkw.onkeydown=function(e){if(e.key==='Enter')fok.click()};
  bindPager();
  Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(b){
    b.onclick=function(){openDetail(b.getAttribute('data-view'))};
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'),function(b){
    b.onclick=function(){
      S.editId=b.getAttribute('data-edit');
      S.formFrom=(slot==='filtersAll'?'all':'village');
      S.view='form';render();window.scrollTo(0,0);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-warn]'),function(b){
    b.onclick=function(){openWarn(b.getAttribute('data-warn'))};
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){
    b.onclick=function(){openDelete(b.getAttribute('data-del'))};
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-restore]'),function(b){
    b.onclick=function(){
      var p=findP(b.getAttribute('data-restore'));
      if(!p)return;
      p.status=1;p.updatedAt=nowStr();saveDB();render();
      toast('已恢复该条数据','ok');
    };
  });
  bindNotes();
}

function compressImage(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=560,w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max}
      else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.62));
    };
    img.onerror=function(){cb('')};
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

/* 需求 6：附件照片点击放大预览。
   注意：这里**不能**用 openModal —— openModal 是整块覆盖 #modal-root，
   会把底下的「人员详情」弹窗一起冲掉，关掉放大图就退回列表页了。
   所以放大图做成独立浮层（z-index 400 > .mask 的 200），
   关掉它只移除自己，详情弹窗原样保留。 */
function openZoom(src){
  if(!src)return;
  closeZoom();
  var d=document.createElement('div');
  d.id='zoom-layer';
  d.className='zoom-layer';
  d.innerHTML='<div class="zk">✕</div>'
    +'<img src="'+src+'" alt="照片预览">'

function downloadBlob(blob,name){

function parseFam(s){
  if(!s)return [];
  return String(s).split(/[；;]/).filter(Boolean).map(function(x){
    /* 兼容两种写法：姓名(关系,电话) 与 姓名(关系,电话,住址) */
    var m=x.match(/^([^(（]*)[(（]([^)）]*)[)）]?/);
    if(m){
      var parts=String(m[2]||'').split(/[,，]/);
      return {name:m[1],relation:parts[0]||'其他',phone:parts[1]||'',address:parts[2]||'',remark:''};
    }
    return {name:x,relation:'其他',phone:'',address:'',remark:''};
  });
}
function parseCt(s){
  if(!s)return [];
  return String(s).split(/[；;]/).filter(Boolean).map(function(x){
    var t=x.trim().split(/\s+/);
    return {date:t[0]||'',method:(t[1]&&METHODS.indexOf(t[1])>=0)?t[1]:'电话',
      fixedIncome:(t[2]==='否'?'否':'是'),situation:t.slice(3).join(' ')||x.trim(),photos:[]};
  });
}
function doImport(){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='.xlsx,.xls,.csv';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    var isCSV=/\.csv$/i.test(f.name);
    if(window.XLSX&&!isCSV){
      var r=new FileReader();
      r.onload=function(e){
        try{
          var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
          var ws=wb.Sheets[wb.SheetNames[0]];
          var aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
          importRows(aoa);
        }catch(err){toast('文件解析失败：'+err.message,'err')}
      };
      r.readAsArrayBuffer(f);
    }else{
      var r2=new FileReader();
      r2.onload=function(e){
        var txt=String(e.target.result).replace(/^\ufeff/,'');
        var aoa=txt.split(/\r?\n/).filter(function(l){return l.trim()!==''}).map(function(l){
          return l.split(',').map(function(c){return c.replace(/^"|"$/g,'').replace(/""/g,'"')});
        });
        importRows(aoa);
      };
      r2.readAsText(f,'utf-8');
    }
  };
  inp.click();
}
function importRows(aoa){
  if(!aoa||aoa.length<2){toast('文件内容为空','err');return}
  var head=aoa[0].map(function(h){return String(h).trim()});
  var idx={};IMPORT_HEADERS.forEach(function(h){idx[h]=head.indexOf(h)});
  if(idx['姓名']<0||idx['行政村名']<0){toast('未识别到「姓名」「行政村名」列，请使用下载的模板','err');return}
  var ok=0,skip=0,rows=[];
  for(var i=1;i<aoa.length;i++){
    var r=aoa[i];if(!r||!String(r[idx['姓名']]||'').trim())continue;
    var v=String(r[idx['行政村名']]||'').trim();
    if(!v||VILLAGES.indexOf(v)<0){skip++;continue}
    if(!canAccess(v)){skip++;continue}
    /* 风险等级非必填（需求 8）：空 / 非法值一律记为 0 = 未评定 */
    var risk=parseInt(String(r[idx['风险防控等级']]||'').replace(/[^\d]/g,''),10);
    if(!(risk>=1&&risk<=3))risk=0;
    var np=newPerson(v);
    np.id='P'+uid();
    np.name=String(r[idx['姓名']]).trim();
    np.gender=String(r[idx['性别']]||'男').trim()||'男';
    np.idCard=String(r[idx['身份证号']]||'').trim();
    np.address=String(r[idx['家庭住址']]||'').trim();
    np.phone=String(r[idx['联系方式']]||'').trim();
    np.category=CAT_NAMES.indexOf(String(r[idx['人员类别']]||'').trim())>=0?String(r[idx['人员类别']]).trim():CAT_NAMES[0];
    np.political=POLITICAL.indexOf(String(r[idx['政治面貌']]||'').trim())>=0?String(r[idx['政治面貌']]).trim():'群众';
    np.enlistDate=String(r[idx['入伍时间']]||'').trim();
    np.dischargeDate=String(r[idx['退伍时间']]||'').trim();
    np.isSecretary=String(r[idx['是否兵支书']]||'否').trim()==='是'?'是':'否';
    np.merit=String(r[idx['立功信息']]||'').trim();
    np.riskLevel=risk;
    np.family=parseFam(r[idx['家庭成员信息']]);
    np.contacts=parseCt(r[idx['常态化联系信息']]);
    np.remark=String(r[idx['备注']]||'').trim();
    np.status=1;np.delReason='';np.delAt='';
    np.createdAt=today();np.updatedAt='';
    rows.push(np);
    ok++;
  }
  if(!ok){toast('没有可导入的有效数据（共跳过 '+skip+' 行）','err');return}
  openModal('<div class="mh"><b>导入确认</b><div class="spacer"></div><button class="x" data-close="1">✕</button></div>'
    +'<div class="mb"><div>已解析到 <b>'+ok+'</b> 条有效数据'+(skip?'，跳过 '+skip+' 行（村名无效或无权限）':'')+'。</div>'
      +'<div class="tiny muted3 mt12">数据将追加到对应行政村，重复人员不会自动去重，请确认后再导入。</div></div>'
    +'<div class="mf"><button class="btn" data-close="1">取消</button><button class="btn pri" id="im-ok">确认导入</button></div>');
  $('im-ok').onclick=function(){
    DB.persons=DB.persons.concat(rows);saveDB();closeModal();render();
    toast('成功导入 '+rows.length+' 条','ok');
  };
}

/* ---------------- 视图：来访诉求 ---------------- */
function visitsOf(){
  if(!S.user)return [];
  if(S.user.lv==='town')return DB.visits.slice();
  return DB.visits.filter(function(x){return x.village===S.user.v});
}
function blankVisitFilter(){return {kw:'',handle:'',village:''}}
function viewVisit(){
  if(!S.visitFilter)S.visitFilter=blankVisitFilter();
  var f=S.visitFilter;
  var isTown=(S.user.lv==='town');
  var list=visitsOf().filter(function(x){
    if(S.showDeleted){if(x.status!==0)return false}else{if(x.status!==1)return false}
    if(f.kw){
      var kw=f.kw;
      if(!((x.name||'').indexOf(kw)>=0||(x.phone||'').indexOf(kw)>=0
        ||(x.address||'').indexOf(kw)>=0||(x.appeal||'').indexOf(kw)>=0))return false;
    }
    if(f.handle&&x.handle!==f.handle)return false;
    if(f.village&&x.village!==f.village)return false;
    return true;
  }).sort(function(a,b){
    var da=a.date||'',db=b.date||'';
    if(da!==db)return da<db?1:-1;                 /* 来访时间倒序：最近的排最前 */
    return (b.createdAt||'')<(a.createdAt||'')?-1:1;
  });
  var done=0,doing=0,none=0;
  list.forEach(function(x){
    if(x.handle==='已办结')done++;else if(x.handle==='处理中')doing++;else none++;
  });
  /* 来访人员次数统计：姓名 + 手机号相同视为同一人 */
  var map={},order=[];
  list.forEach(function(x){
    var k=(x.name||'')+'|'+(x.phone||'');
    if(!map[k]){map[k]={name:x.name,phone:x.phone,n:0,last:''};order.push(k)}
    map[k].n++;
    if((x.date||'')>map[k].last)map[k].last=x.date||'';
  });
  var rank=order.map(function(k){return map[k]}).sort(function(a,b){return b.n-a.n});
  var maxN=1;rank.forEach(function(r){if(r.n>maxN)maxN=r.n});
  var rankHtml=rank.slice(0,12).map(function(r){
    var w=Math.round(r.n/maxN*100);if(w<4)w=4;
    return '<div class="vs"><span class="n">'+esc(r.name||'—')
      +(r.phone?'<span class="muted3"> '+esc(maskPhone(r.phone))+'</span>':'')+'</span>'
      +'<span class="t"><i style="width:'+w+'%"></i></span><span class="c">'+r.n+' 次</span></div>';
  }).join('')||'<div class="tiny muted3">暂无来访记录</div>';

  var pageSize=20,total=list.length,pages=Math.max(1,Math.ceil(total/pageSize));
  if(S.page>pages)S.page=pages;if(S.page<1)S.page=1;
  var start=(S.page-1)*pageSize;
  var rows=list.slice(start,start+pageSize);
  var trs=rows.map(function(x,i){
    return '<tr>'
      +'<td>'+(start+i+1)+'</td>'
      +(isTown?'<td>'+esc(x.village||'—')+'</td>':'')
      +'<td>'+esc(x.date||'—')+'</td>'
      +'<td><b>'+esc(x.name||'—')+'</b></td>'
      +'<td>'+esc(x.gender||'—')+'</td>'
      +'<td>'+esc(x.nation||'—')+'</td>'
      +'<td>'+esc(x.address||'—')+'</td>'

function bindVisit(){
  bindTopbar();

  $('vi-query').onclick=function(){$('vi-filter').classList.toggle('hide')};
  $('vi-deleted').onclick=function(){S.showDeleted=!S.showDeleted;S.page=1;render()};

  if(ok)ok.onclick=function(){
    S.visitFilter={kw:$('if-kw').value.trim(),handle:$('if-status').value,
      village:($('if-village')?$('if-village').value:'')};

  if(kw)kw.onkeydown=function(e){if(e.key==='Enter'&&ok)ok.click()};

    b.onclick=function(){openVisitDetail(b.getAttribute('data-vview'))};

  Array.prototype.forEach.call(document.querySelectorAll('[data-vedit]'),function(b){
    b.onclick=function(){openVisitForm(b.getAttribute('data-vedit'))};
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-vdel]'),function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-vdel'),x=findVisit(id);if(!x)return;

        '将删除 <b>'+esc(x.name||'—')+'</b> 于 '+esc(x.date||'—')+' 的来访记录。',
        function(note){
          x.status=0;x.delReason=note;x.delAt=nowStr();
          saveDB();closeModal();render();
          toast('已删除该条来访记录','ok');

    b.onclick=function(){
      var x=findVisit(b.getAttribute('data-vrestore'));if(!x)return;
      x.status=1;x.updatedAt=nowStr();saveDB();render();

  });

}

/* ---------------- 视图：数据看板 ---------------- */
function barRow(label,value,max,color,unit){
  var w=max>0?Math.round(value/max*100):0;
  if(value>0&&w<3)w=3;
  return '<div class="bar"><span class="bl" title="'+esc(label)+'">'+esc(label)+'</span>'
    +'<span class="bt"><i style="width:'+w+'%;background:'+color+'"></i></span>'
    +'<span class="bv">'+value+(unit?'<u>'+esc(unit)+'</u>':'')+'</span></div>';
}
function donut(parts,size){
  var tot=0,i;for(i=0;i<parts.length;i++)tot+=parts[i].v;
  var R=size/2-9, C=2*Math.PI*R, off=0, segs='';
  parts.forEach(function(p){
    var len=tot>0?C*(p.v/tot):0;
    if(len>0){
      segs+='<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+R+'" fill="none" stroke="'+p.c
        +'" stroke-width="17" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)
        +'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/>';
    }
    off+=len;
  });
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+R+'" fill="none" stroke="#f1f4f9" stroke-width="17"/>'
    +segs
    +'<text x="'+(size/2)+'" y="'+(size/2-2)+'" text-anchor="middle" font-size="23" font-weight="600" fill="#1e2430">'+tot+'</text>'
    +'<text x="'+(size/2)+'" y="'+(size/2+16)+'" text-anchor="middle" font-size="11" fill="#939ba8">总人数</text>'
    +'</svg>';
}
function legendOf(parts){
  var tot=0,i;for(i=0;i<parts.length;i++)tot+=parts[i].v;
  return '<div class="legend">'+parts.map(function(p){
    return '<div class="lg"><i style="background:'+p.c+'"></i><span class="n">'+esc(p.n)+'</span>'
      +'<span class="v">'+p.v+' <u style="color:#939ba8;text-decoration:none">'
      +(tot>0?Math.round(p.v/tot*100):0)+'%</u></span></div>';
  }).join('')+'</div>';
}
function viewBoard(){
  var isTown=S.user.lv==='town';
  var scope=isTown?VILLAGES.slice():[S.user.v];
  var t=townStat();
  /* 类别分布 */
  var catCount={},visitCnt=0,fieldCnt=0,photoCnt=0,secCnt=0,partyCnt=0,aidCnt=0;
  scope.forEach(function(v){
    personsOf(v).forEach(function(p){
      catCount[p.category]=(catCount[p.category]||0)+1;
      if(p.isSecretary==='是')secCnt++;
      if(p.political==='中共党员'||p.political==='中共预备党员')partyCnt++;
      (p.contacts||[]).forEach(function(c){
        visitCnt++;
        if(c.method==='实地走访')fieldCnt++;
        photoCnt+=(c.photos||[]).length;
      });
      /* 帮扶记录（含附件照片） */
      (p.aids||[]).forEach(function(a){
        aidCnt++;
        photoCnt+=(a.photos||[]).length;
      });
      if(p.photo)photoCnt++;
    });
  });
  var catParts=CAT_NAMES.map(function(n,i){
    return {n:n,v:catCount[n]||0,c:CHART_COLORS[i%CHART_COLORS.length]};
  }).filter(function(x){return x.v>0});
  /* 风险分布（含「未评定」，需求 8 允许风险等级留空） */
  var r=[0,0,0,0];
  scope.forEach(function(v){var q=statOf(v);r[0]+=q.r1;r[1]+=q.r2;r[2]+=q.r3;r[3]+=q.r0});
  var riskParts=[{n:'1 级 · 高风险',v:r[0],c:'#d92d20'},{n:'2 级 · 中风险',v:r[1],c:'#e8a300'},
    {n:'3 级 · 低风险',v:r[2],c:'#2a7de1'}];
  if(r[3]>0)riskParts.push({n:'未评定',v:r[3],c:'#9aa4b2'});
  /* 各村对比 */
  var rows=scope.map(function(v){var q=statOf(v);return {v:v,q:q}});
  var maxVet=1;rows.forEach(function(x){if(x.q.veteran>maxVet)maxVet=x.q.veteran});
  var cmpBars=rows.slice().sort(function(a,b){return b.q.veteran-a.q.veteran})
    .map(function(x){return barRow(x.v,x.q.veteran,maxVet,'#1652a8','人')}).join('');
  /* 类别条形（全乡/本村） */
  var maxCat=1;catParts.forEach(function(p){if(p.v>maxCat)maxCat=p.v});
  var catBars=catParts.slice().sort(function(a,b){return b.v-a.v})
    .map(function(p,i){return barRow(p.n,p.v,maxCat,CHART_COLORS[CAT_NAMES.indexOf(p.n)%CHART_COLORS.length],'人')}).join('');

  var head=isTown
    ?'<div class="stats mt16">'
      +statCard('全乡建档总数','d-blue',t.total,'人','')
      +statCard('退役军人','d-blue',t.veteran,'人','veteran')
      +statCard('重点优抚对象','d-amber',t.key,'人','key')
      +statCard('两参人员','d-red',t.lc,'人','lc')
      +statCard('1 级风险','d-red',t.r1,'人','risk1')
      +statCard('覆盖行政村','d-gray',t.covered+'/21','','')
     +'</div>'
    :(function(){var q=statOf(S.user.v);
      return '<div class="stats mt16">'
        +statCard('本村建档总数','d-blue',q.total,'人')
        +statCard('退役军人','d-blue',q.veteran,'人')
        +statCard('重点优抚对象','d-amber',q.key,'人')
        +statCard('两参人员','d-red',q.lc,'人')
        +statCard('党员','d-green',q.party,'人')
        +statCard('兵支书','d-gray',q.secretary,'人')
       +'</div>'})();

  return topbar(isTown?'全乡数据看板':(S.user.v+' · 数据看板'))
    +'<div class="wrap" style="padding-bottom:28px">'
      +head
      +(isTown?'<div class="tiny muted3 mt12">点击上方统计卡可跳转到「全乡人员列表」并自动筛选对应人群。</div>':'')
      +'<div class="panels mt16">'
        +'<div class="panel"><h3>人员类别分布<span class="more">共 '+catParts.reduce(function(a,b){return a+b.v},0)+' 人</span></h3>'
          +'<div class="donut-wrap">'+donut(catParts,168)+legendOf(catParts)+'</div></div>'
        +'<div class="panel"><h3>风险防控等级分布</h3>'
          +'<div class="donut-wrap">'+donut(riskParts,168)+legendOf(riskParts)+'</div></div>'
      +'</div>'
      +'<div class="panels mt16">'
        +'<div class="panel"><h3>'+(isTown?'各行政村退役军人数量对比':'人员类别明细')+'</h3>'
          +'<div class="bars">'+(isTown?cmpBars:catBars)+'</div></div>'
        +'<div class="panel"><h3>常态化联系与走访情况</h3>'
          +'<div class="bars">'
            +barRow('联系走访记录',visitCnt,Math.max(visitCnt,1),'#2a7de1','次')
            +barRow('其中实地走访',fieldCnt,Math.max(visitCnt,1),'#0f9d58','次')
            +barRow('帮扶记录',aidCnt,Math.max(aidCnt,1),'#7f77dd','条')
            +barRow('照片总数',photoCnt,Math.max(photoCnt,1),'#c9a227','张')
            +barRow('党员人数',partyCnt,Math.max(partyCnt,1),'#d92d20','人')
            +barRow('兵支书',secCnt,Math.max(secCnt,1),'#7f77dd','人')
          +'</div></div>'
      +'</div>'
      +(isTown?'<div class="panel mt16"><h3>各行政村重点优抚对象 / 两参人员对比</h3><div class="panels" style="gap:24px">'
        +'<div class="bars">'+rows.slice().sort(function(a,b){return b.q.key-a.q.key})
          .map(function(x){return barRow(x.v,x.q.key,Math.max.apply(null,rows.map(function(y){return y.q.key}))||1,'#c9a227','人')}).join('')+'</div>'
        +'<div class="bars">'+rows.slice().sort(function(a,b){return b.q.lc-a.q.lc})
          .map(function(x){return barRow(x.v,x.q.lc,Math.max.apply(null,rows.map(function(y){return y.q.lc}))||1,'#d92d20','人')}).join('')+'</div>'
        +'</div></div>':'')
      +noteBox('board','数据看板页面备注','例如：数据统计口径说明、上报时间等')
    +'</div>';
}

  };
  $('data-restore').onclick=function(){
    var inp=document.createElement('input');
    inp.type='file';inp.accept='.json';
    inp.onchange=function(){
      var f=inp.files&&inp.files[0];if(!f)return;
      var r=new FileReader();
      r.onload=function(e){
        var obj=null;
        try{obj=JSON.parse(e.target.result)}catch(err){toast('备份文件解析失败','err');return}
        var d=obj&&obj.data?obj.data:obj;
        if(!d||!d.persons||!d.persons.length){toast('备份文件格式不正确','err');return}
        openModal('<div class="mh"><b>恢复备份确认</b><div class="spacer"></div><button class="x" data-close="1">✕</button></div>'
          +'<div class="mb"><div style="background:#fdecea;border:1px solid #f3c3bd;border-radius:9px;padding:12px 14px;font-size:13px;color:#a32017">'
          +'恢复将<b>覆盖</b>当前全部数据（现有 '+DB.persons.length+' 条档案 → 备份中 '+d.persons.length+' 条档案），请确认。</div>'
          +'<div class="mt16"><label class="fl">恢复备注<span class="req">*</span></label>'
          +'<textarea class="inp" id="rs-note" rows="2" placeholder="请填写恢复原因（必填）"></textarea></div></div>'
          +'<div class="mf"><button class="btn" data-close="1">取消</button><button class="btn danger" id="rs-ok">确认恢复</button></div>');
        $('rs-ok').onclick=function(){
          var n=$('rs-note').value.trim();
          if(!n){toast('请填写恢复备注','err');return}
          DB.persons=d.persons;DB.warnings=d.warnings||[];DB.passwords=d.passwords||{};
          DB.pageNotes=d.pageNotes||{};DB.visits=d.visits||[];DB.baoyi=d.baoyi||[];
          normalizeDB();
          saveDB();closeModal();render();
          toast('已从备份恢复 '+d.persons.length+' 条档案','ok');
        };
      };
      r.readAsText(f,'utf-8');
    };
    inp.click();
  };
  $('data-export-all').onclick=function(){
    var rows=[IMPORT_HEADERS];
    VILLAGES.forEach(function(v){
      personsOf(v).forEach(function(p){rows.push(rowOf(p))});
    });
    if(rows.length<2){toast('暂无可导出数据','err');return}
    if(window.XLSX){
      var ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:12},{wch:10},{wch:6},{wch:20},{wch:24},{wch:14},{wch:16},{wch:12},{wch:12},{wch:12},{wch:9},{wch:14},{wch:12},{wch:36},{wch:44},{wch:18}];
      var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'全乡人员台账');
      XLSX.writeFile(wb,'向阳堡乡退役军人台账_'+today()+'.xlsx');
    }else{
      downloadBlob(new Blob([toCSV(rows)],{type:'text/csv;charset=utf-8'}),'向阳堡乡退役军人台账_'+today()+'.csv');
    }
    toast('已导出全乡 '+(rows.length-1)+' 条台账','ok');
  };
  $('data-reset').onclick=function(){
    openModal('<div class="mh"><b>清空数据确认</b><div class="spacer"></div><button class="x" data-close="1">✕</button></div>'
      +'<div class="mb"><div style="background:#fdecea;border:1px solid #f3c3bd;border-radius:9px;padding:12px 14px;font-size:13px;color:#a32017">'
      +'此操作将<b>删除全部人员档案、预警记录、来访诉求、七包一台账与页面备注</b>（含修改过的密码），系统恢复为空白状态，<b>不可撤销</b>。建议先「导出全部数据」备份。</div>'
      +'<div class="mt16"><label class="fl">清空原因<span class="req">*</span></label>'
      +'<textarea class="inp" id="rz-note" rows="2" placeholder="请填写清空原因（必填）"></textarea></div></div>'
      +'<div class="mf"><button class="btn" data-close="1">取消</button><button class="btn danger" id="rz-ok">确认清空</button></div>');
    $('rz-ok').onclick=function(){
      var n=$('rz-note').value.trim();
      if(!n){toast('请填写重置备注','err');return}
      resetDB();closeModal();render();
      toast('已清空全部数据，系统恢复为空白状态','ok');
    };
  };
  bindNotes();
}

/* ---------------- 渲染入口 ---------------- */
function render(){
  var app=$('app');
  if(S.view==='login'||!S.user){
    app.innerHTML=viewLogin();bindLogin();
    bindModalClose();return;
  }
  /* 权限守卫：村级账号不可访问乡级专属页面 */
  if(S.user.lv!=='town'&&(S.view==='board'||S.view==='data'||S.view==='all'||S.view==='baoyi'))S.view='village';
  if(S.view==='village'&&!S.village)S.village=(S.user.lv==='town'?VILLAGES[0]:S.user.v);
  if(S.view==='form'&&!S.editId&&!S.village)S.village=(S.user.lv==='town'?VILLAGES[0]:S.user.v);

  if(S.view==='map'){app.innerHTML=viewMap();bindMap();bindModalClose();return}
  if(S.view==='village'){app.innerHTML=viewVillage();bindVillage();bindModalClose();return}
  if(S.view==='all'){app.innerHTML=viewAll();bindAll();bindModalClose();return}
  if(S.view==='form'){app.innerHTML=viewForm();bindForm();bindModalClose();return}
  if(S.view==='board'){app.innerHTML=viewBoard();bindBoard();bindModalClose();return}
  if(S.view==='warn'){app.innerHTML=viewWarn();bindWarn();bindModalClose();return}
  if(S.view==='visit'){app.innerHTML=viewVisit();bindVisit();bindModalClose();return}
  if(S.view==='baoyi'){app.innerHTML=viewBaoyi();bindBaoyi();bindModalClose();return}
  if(S.view==='data'){app.innerHTML=viewData();bindData();bindModalClose();return}
  S.view='map';app.innerHTML=viewMap();bindMap();bindModalClose();
}
function bindModalClose(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){
    b.onclick=closeModal;
  });
  var mask=document.querySelector('[data-mask]');
  if(mask)mask.onclick=function(e){if(e.target===mask)closeModal()};
}
document.addEventListener('click',function(e){
  var t=e.target;
  /* 账号下拉：点到别处就收起 */
  var ac=$('lg-ac');
  if(ac&&!ac.classList.contains('hide')&&!(t&&t.closest&&t.closest('.ac-wrap')))hideAc();
  var c=t&&t.closest?t.closest('[data-close]'):null;
  if(c){closeModal();return}
  /* 需求 6：所有附件照片点击放大预览（人员照片 / 走访照片 / 帮扶照片） */
  if(t&&t.tagName==='IMG'&&t.closest&&t.closest('.photos,.frame'))openZoom(t.getAttribute('src'));
});
/* 放大浮层：按 Esc 关闭（浮层不在时为空操作） */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'||e.keyCode===27)closeZoom();
});

/* ---------------- 启动 ---------------- */
loadDB();
saveDB();
render();
</script>
